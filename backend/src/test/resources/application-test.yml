spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  ai:
    openai:
      api-key: test-dummy-key
      chat:
        options:
          model: gpt-4o-mini
  rabbitmq:
    listener:
      simple:
        auto-startup: false

ats:
  rabbitmq:
    exchange: ats.exchange.test
    queue: ats.resume.analysis.queue.test
    routing-key: resume.analyze.test
