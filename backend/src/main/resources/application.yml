server:
  port: 8080

spring:
  application:
    name: ats-optimizer-backend

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ats_optimizer}
    username: ${SPRING_DATASOURCE_USERNAME:ats_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ats_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
          temperature: 0.2

ats:
  rabbitmq:
    exchange: ats.exchange
    queue: resume.ai.analysis
    routing-key: resume.ai.analysis
    dlx-exchange: ats.exchange.dlx
    dlq-queue: resume.ai.analysis.dlq
    dlq-routing-key: resume.ai.analysis.dlq

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
